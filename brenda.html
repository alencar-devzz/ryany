<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050108;--glow:#2a0f22;--pink:#ff9fc0;--gold:#ffd79a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#050108}}
:root[data-theme="dark"]{--bg:#050108}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);-webkit-user-select:none;user-select:none}
body{background:radial-gradient(ellipse at 50% 38%,var(--glow) 0%,#0c0510 55%,var(--bg) 100%)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:1}
.hint{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));margin:0;text-align:center;font:12px system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--pink);pointer-events:none;opacity:0;animation:hint 3s ease-in-out 4s infinite;transition:opacity .4s}
body.go .hint{animation:none;opacity:0}
@keyframes hint{0%,100%{opacity:0}50%{opacity:.6}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<p class="hint">toque na tela</p>
<script>// Ajuste tudo por aqui
window.ILY={cfg:{
  text:'Brenda',
  color:'#ffb0cf',
  font:'600 {s}px "Segoe UI",system-ui,sans-serif',
  size:15,gap:12,rowGap:3,
  tailRows:9,massSpeed:150,scatterStart:.55,spawnEvery:.5,introTime:1.5,
  heartCols:12,heartScale:.5,gravity:300
}};
</script>
<script>// Sprites do texto (normal e brilhante) + célula "viva"
(function(I){const c=I.cfg;
I.T=0;I.ptr={x:-999,y:-999,a:0,t:-9};
I.buildSprites=function(){
  const s=c.size*2,pad=s*.7,m=document.createElement('canvas').getContext('2d');
  m.font=c.font.replace('{s}',s);const tw=Math.ceil(m.measureText(c.text).width);
  I.tw=tw/2;I.th=s/2;I.sprites=[];
  [[c.color,5],['#fff3f8',14]].forEach(([col,bl])=>{
    const cv=document.createElement('canvas');cv.width=tw+pad*2;cv.height=s+pad*2;
    const g=cv.getContext('2d');g.font=m.font;g.textAlign='center';g.textBaseline='middle';
    g.fillStyle=col;g.shadowColor=c.color;g.shadowBlur=bl;g.fillText(c.text,cv.width/2,cv.height/2);
    I.sprites.push(cv);
  });
};
I.draw=function(ctx,lv,x,y,sc,al,rot){
  const sp=I.sprites[lv>=6?1:0],w=sp.width/2*sc,h=sp.height/2*sc;
  ctx.globalAlpha=al;
  if(rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.drawImage(sp,-w/2,-h/2,w,h);ctx.restore();}
  else ctx.drawImage(sp,x-w/2,y-h/2,w,h);
};
I.cell=function(ctx,x,y,a,seed,phase,head,q,pb,bs){
  q=q===undefined?1:q;if(q<=0)return;
  const T=I.T,p=I.ptr;let b=Math.max(head?1:0,pb||0);
  if(p.a>0){const d=Math.hypot(x-p.x,y-p.y);if(d<150)b=Math.max(b,(1-d/150)*p.a);}
  const f=T*2.5,v=Math.sin(seed*91.7+Math.floor(f)*37.3)*43758.5453;
  if(v-Math.floor(v)>.975)b=Math.max(b,.9*Math.sin(Math.PI*(f-Math.floor(f))));
  let sc=(bs||1)*(1+b*.12)*(1+.05*Math.pow(Math.max(0,Math.sin(T*2.6+phase)),10));
  let ay=0,fl=0;
  if(q<1){const t=q-1,eb=1+2.70158*t*t*t+1.70158*t*t;sc*=.3+.7*eb;a*=q<.35?q/.35:1;ay=(1-q)*14;fl=(1-q);}
  I.draw(ctx,0,x,y-ay,sc,a*(.8+.2*Math.sin(T*2.2+phase)));
  const bb=Math.max(b,fl*1.2);
  if(bb>.03)I.draw(ctx,1,x,y-ay,sc,Math.min(1,a*bb*1.3));
};
})(window.ILY);
</script>
<script>// Fundo vivo: estrelinhas, bolinhas de luz, aurora e uma estrela cadente ocasional
(function(I){const B=I.bg={},r=Math.random;let W,H,stars=[],motes=[],shoot=null,shootT=2+r()*4;
B.resize=function(w,h){W=w;H=h;stars=[];motes=[];
  for(let i=0;i<Math.round(w*h/9000);i++)stars.push({x:r()*W,y:r()*H,r:.4+r()*1,ph:r()*6,sp:.6+r()*1.6});
  for(let i=0;i<14;i++)motes.push({x:r()*W,y:r()*H,r:10+r()*34,v:8+r()*16,ph:r()*6,a:.04+r()*.06});};
B.draw=function(ctx,dt){
  const T=I.T;ctx.globalCompositeOperation='lighter';
  const R=Math.max(W,H)*.6,g=ctx.createRadialGradient(W/2,H*.45,0,W/2,H*.45,R);
  g.addColorStop(0,'rgba(255,120,170,'+(.05+.04*Math.sin(T*.8))+')');g.addColorStop(1,'rgba(255,120,170,0)');
  ctx.globalAlpha=1;ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const aw=(Math.sin(T*.12)*.5+.5)*W,ag=ctx.createRadialGradient(aw,H*.08,0,aw,H*.08,W*.5);
  ag.addColorStop(0,'rgba(255,200,150,.05)');ag.addColorStop(1,'rgba(255,200,150,0)');
  ctx.fillStyle=ag;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffd9e6';
  for(const s of stars){ctx.globalAlpha=.12+.5*(.5+.5*Math.sin(T*s.sp+s.ph));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();}
  for(const m of motes){
    m.y-=m.v*dt;if(m.y<-m.r*2){m.y=H+m.r*2;m.x=r()*W;}
    const x=m.x+Math.sin(T*.5+m.ph)*14,q=ctx.createRadialGradient(x,m.y,0,x,m.y,m.r);
    q.addColorStop(0,'rgba(255,160,200,'+m.a+')');q.addColorStop(1,'rgba(255,160,200,0)');
    ctx.globalAlpha=1;ctx.fillStyle=q;ctx.fillRect(x-m.r,m.y-m.r,m.r*2,m.r*2);
  }
  shootT-=dt;
  if(!shoot&&shootT<=0){shootT=5+r()*7;shoot={x:r()*W*.6+W*.2,y:r()*H*.12,vx:240+r()*120,vy:95+r()*50,age:0,life:.65};}
  if(shoot){shoot.age+=dt;const u=shoot.age/shoot.life;
    if(u<1){shoot.x+=shoot.vx*dt;shoot.y+=shoot.vy*dt;const a=Math.sin(u*Math.PI);
      ctx.strokeStyle='rgba(255,235,215,'+(.85*a)+')';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(shoot.x,shoot.y);ctx.lineTo(shoot.x-shoot.vx*.09,shoot.y-shoot.vy*.09);ctx.stroke();
    }else shoot=null;
  }
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
};
})(window.ILY);
</script>
<script>// Bloco gigante + grupinhos em cascata (chuva do nome)
(function(I){const c=I.cfg,R=I.rain={};
let W,H,cols,cw,rh,s=0,inited=false,groups=[],acc=0,first=true;
const cl=(x,a,b)=>Math.min(b,Math.max(a,x));
R.scatter=false;R.done=false;
R.resize=function(w,h){
  W=w;H=h;cw=I.tw+c.gap;rh=I.th*1.15+c.rowGap;cols=Math.ceil(W/cw)+1;
  if(!inited){inited=true;s=-rh;}
};
R.drawMass=function(ctx,dt,ga){
  if(R.done)return;
  s+=c.massSpeed*dt;
  const T=c.tailRows,N=Math.ceil(H/rh)+2+T,tailY=s-(N-1)*rh,wy=((I.T%4.5)/4.5)*(H*1.4)-H*.2;
  if(tailY>H*c.scatterStart)R.scatter=true;
  if(tailY>H+rh){R.done=true;return;}
  for(let k=0;k<N;k++){
    const y=s-k*rh;if(y<-rh||y>H+rh)continue;
    const tail=k<N-T?1:1-(k-(N-T)+1)/(T+1);
    const a=Math.min(1,y/(H*.06))*Math.min(1,(H*1.05-y)/(H*.2))*tail*ga*.85;
    if(a<=.01)continue;
    const pb=Math.max(0,1-Math.abs(y-wy)/90)*.6;
    for(let i=0;i<cols;i++)I.cell(ctx,i*cw-cw*.3+I.tw/2,y,a,i*1.7+k*13.1,i*.5-k*.35,k===0,1,pb);
  }
  ctx.globalAlpha=1;
};
function mkGroup(y,delay){
  const gc=1+(Math.random()*(W>600?3:2)|0),gr=5+(Math.random()*6|0),w=gc*cw;
  for(let t=0;t<8;t++){
    const x=Math.random()*Math.max(1,W-w+cw*.3);
    if(groups.some(g=>x<g.x+g.w+8&&g.x<x+w+8))continue;
    mkGroup.n=(mkGroup.n||0)+1;
    groups.push({id:mkGroup.n,ph:Math.random()*6,x,w,gc,gr,tl:Math.ceil(gr*.5),v:70+Math.random()*90,y,age:-(delay||0)});return;
  }
}
R.drawDrops=function(ctx,dt){
  if(R.scatter){
    if(first){first=false;for(let i=0;i<10;i++)mkGroup(Math.random()*H*.9-H*.2,i*.35);}
    acc+=dt;while(acc>c.spawnEvery){acc-=c.spawnEvery;if(groups.length<16)mkGroup(-Math.random()*H*.15,0);}
  }
  for(let n=groups.length-1;n>=0;n--){
    const g=groups[n];g.age+=dt;if(g.age>0)g.y+=g.v*dt;
    if(g.y-(g.gr-1)*rh>H+rh){groups.splice(n,1);continue;}
    if(g.age<=0)continue;
    if(g.age<1){
      const cx=g.x+g.w/2,cy=g.y-(g.gr-1)*rh/2,r=Math.max(g.w,g.gr*rh)*.75,k=Math.sin(Math.PI*g.age)*.22;
      const gr=ctx.createRadialGradient(cx,cy,0,cx,cy,r);gr.addColorStop(0,'rgba(255,170,205,'+k+')');gr.addColorStop(1,'rgba(255,170,205,0)');
      ctx.globalCompositeOperation='lighter';ctx.globalAlpha=1;ctx.fillStyle=gr;ctx.fillRect(cx-r,cy-r,r*2,r*2);ctx.globalCompositeOperation='source-over';
    }
    const wr=(g.gr+2)-(((I.T+g.ph)%3.2)/3.2)*(g.gr+4);
    for(let r=0;r<g.gr;r++){
      const y=g.y-r*rh;if(y<-rh||y>H+rh)continue;
      const tail=r<g.gr-g.tl?1:1-(r-(g.gr-g.tl)+1)/(g.tl+1);
      const a=Math.min(1,Math.max(0,y)/(H*.06))*Math.min(1,Math.max(0,H*1.03-y)/(H*.2))*tail*.9;
      if(a<=.01)continue;
      for(let i=0;i<g.gc;i++){
        const q=cl((g.age-(r*.09+i*.07+((i*7+r*13+g.id*3)%5)*.03))/.55,0,1),pb=Math.max(0,1-Math.abs(r+i*.4-wr)/1.6)*.9*tail;
        I.cell(ctx,g.x+i*cw+I.tw/2+Math.sin(I.T*1.2+g.ph)*5,y,a,g.id*50+i*1.7+r*13.1,i*.5-r*.35,r===0,q,pb);
      }
    }
  }
  ctx.globalAlpha=1;
};
})(window.ILY);
</script>
<script>// Clique: forma um CORAÇÃO feito de "Brenda", bate, e some; arrastar deixa rastro de coraçõezinhos
(function(I){const c=I.cfg,P=[],rnd=Math.random,eo=x=>1-Math.pow(1-x,3),cl=(x,a,b)=>Math.min(b,Math.max(a,x));
const HOLD=3.6,OUT=1.2;
function heartPath(ctx,x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*.35);
  ctx.bezierCurveTo(x-s*.9,y-s*.2,x-s*.5,y-s*.9,x,y-s*.4);
  ctx.bezierCurveTo(x+s*.5,y-s*.9,x+s*.9,y-s*.2,x,y+s*.35);ctx.fill();}
function makeHeart(x,y){
  const W=innerWidth,H=innerHeight,cw=(I.tw+c.gap)*c.heartScale,rh=(I.th*1.15+c.rowGap)*c.heartScale;
  const Wh=Math.min(W*.86,cw*c.heartCols),S=Wh/2.4,Hh=Wh*.95;
  const cx=Math.min(W-Wh/2-8,Math.max(Wh/2+8,x)),cy=Math.min(H-Hh/2-8,Math.max(Hh/2+8,y));
  const rowsN=Math.ceil(Hh/rh)+1,nc=Math.ceil(Wh/cw/2)+1,cells=[];
  for(let r=0;r<rowsN;r++){
    const dy=(r-(rowsN-1)/2)*rh,yy=-dy/S+.13;
    for(let k=-nc;k<=nc;k++){
      const dx=k*cw,xx=dx/S,f=Math.pow(xx*xx+yy*yy-1,3)-xx*xx*yy*yy*yy;
      if(f<=0)cells.push({dx,dy,k,r:rowsN-1-r,d:Math.hypot(dx,dy)/(Wh*.6)*.7+rnd()*.08});
    }
  }
  return{t:'H',x:cx,y:cy,age:0,life:HOLD+OUT+1,cells,rows:rowsN,seed:rnd()*100,Wh};
}
I.burst={
  spawn(x,y,k){
    if(k>=1){
      const h=makeHeart(x,y);
      if(P.filter(p=>p.t==='H').length>=5)P.splice(P.findIndex(p=>p.t==='H'),1);
      P.push(h);
      P.push({t:'g',x:h.x,y:h.y,age:0,life:2.4,big:Math.max(1.4,h.Wh/110)});
      for(let i=0;i<16;i++)P.push({t:'s',x:h.x+(rnd()-.5)*h.Wh*1.1,y:h.y+(rnd()-.5)*h.Wh,age:-rnd()*1.2,life:1+rnd()*1.2,r:1+rnd()*1.8});
    }else{
      for(let i=0;i<4;i++)P.push({t:'h',x:x+(rnd()-.5)*34,y,vx:(rnd()-.5)*40,vy:-(30+rnd()*55),age:0,life:2+rnd()*1.3,s:7+rnd()*7,ph:rnd()*6});
      for(let i=0;i<6;i++)P.push({t:'s',x:x+(rnd()-.5)*70,y:y+(rnd()-.5)*70,age:0,life:.9+rnd()*.9,r:1.4+rnd()*1.8});
    }
    if(P.length>300)P.splice(0,P.length-300);
  },
  draw(ctx,dt){
    for(let i=P.length-1;i>=0;i--){
      const p=P[i];p.age+=dt;const u=p.age/p.life;
      if(u>=1){P.splice(i,1);continue;}
      if(p.age<0)continue;
      if(p.t==='H'){
        const ph=(p.age%1.25)/1.25,beat=Math.exp(-Math.pow((ph-.08)*10,2))+.65*Math.exp(-Math.pow((ph-.3)*10,2)),
              on=cl((p.age-.9)/.4,0,1),s=1+.06*beat*on,wr=p.rows-((p.age%2.4)/2.4)*(p.rows+4)+2;
        for(const q of p.cells){
          const e=cl((p.age-q.d)/.55,0,1),o=cl((p.age-HOLD-q.d*.6)/OUT,0,1),a=.95*(1-o);
          if(a<=.01||e<=0)continue;
          const pb=Math.max(beat*.6*on,Math.max(0,1-Math.abs(q.r-wr)/1.5)*.7*on);
          I.cell(ctx,p.x+q.dx*s,p.y+q.dy*s-o*28,a,p.seed+q.k*1.7+q.r*13.1,q.k*.5-q.r*.35,false,e,pb,c.heartScale);
        }
        ctx.globalAlpha=1;
      }else if(p.t==='h'){
        p.x+=p.vx*dt+Math.sin(p.age*2+p.ph)*12*dt;p.y+=p.vy*dt;p.vy*=.996;
        ctx.globalAlpha=(u<.2?u/.2:1-(u-.2)/.8);ctx.fillStyle=c.color;ctx.shadowColor=c.color;ctx.shadowBlur=18;
        heartPath(ctx,p.x,p.y,p.s*(1+.08*Math.sin(p.age*5+p.ph)));ctx.shadowBlur=0;
      }else{
        ctx.globalCompositeOperation='lighter';
        if(p.t==='s'){
          const a=Math.sin(u*Math.PI);
          ctx.globalAlpha=a*.25;ctx.fillStyle='#ffc4d8';ctx.beginPath();ctx.arc(p.x,p.y,p.r*3,0,7);ctx.fill();
          ctx.globalAlpha=a*.9;ctx.fillStyle='#fff3f8';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
        }else{
          const Rr=(40+eo(u)*80)*(p.big||1),g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,Rr);
          g.addColorStop(0,'rgba(255,170,205,'+(.2*Math.sin(u*Math.PI))+')');g.addColorStop(1,'rgba(255,170,205,0)');
          ctx.globalAlpha=1;ctx.fillStyle=g;ctx.fillRect(p.x-Rr,p.y-Rr,Rr*2,Rr*2);
        }
        ctx.globalCompositeOperation='source-over';
      }
    }
    ctx.globalAlpha=1;
  }
};
})(window.ILY);
</script>
<script>// Loop principal, toque e mensagens
(function(I){const c=I.cfg,cv=document.getElementById('c'),ctx=cv.getContext('2d'),p=I.ptr;
let W,H,dpr,T=0,last=performance.now(),down=false,lastDrag=0;
function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;I.rain.resize(W,H);I.bg.resize(W,H);}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000||.016);last=now;T+=dt;I.T=T;
  if(!down&&T-p.t>.25)p.a=Math.max(0,p.a-dt*1.5);
  if(down&&performance.now()-lastDrag>40){lastDrag=performance.now();I.burst.spawn(p.x,p.y,.3);}
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  I.bg.draw(ctx,dt);
  I.rain.drawMass(ctx,dt,Math.min(1,T/c.introTime));
  I.rain.drawDrops(ctx,dt);
  I.burst.draw(ctx,dt);
  requestAnimationFrame(frame);
}
function point(e){p.x=e.clientX;p.y=e.clientY;p.a=1;p.t=T;}
cv.addEventListener('pointerdown',e=>{down=true;point(e);document.body.classList.add('go');I.burst.spawn(e.clientX,e.clientY,1);lastDrag=performance.now();});
cv.addEventListener('pointermove',e=>{point(e);});
['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,()=>{down=false;}));
addEventListener('resize',resize);
I.buildSprites();resize();requestAnimationFrame(frame);
})(window.ILY);
</script>
</body>
